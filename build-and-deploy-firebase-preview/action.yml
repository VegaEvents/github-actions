name: "Build and Deploy to Firebase Preview Channel"
description: "Builds the application and deploys to Firebase Hosting preview channel for PR testing. Caller must authenticate to GCP first (e.g. via google-github-actions/auth)."
author: "Chris Brewer"
inputs:
  build-command:
    description: "build command to run (e.g., yarn build-dev)"
    required: true

  firebase-project:
    description: "Firebase project ID"
    required: true

  firebase-target:
    description: "Firebase hosting target"
    required: true

  channel-id:
    description: "Firebase preview channel ID (e.g. pr-123)"
    required: true

  firebase-tools-version:
    description: "Firebase tools version"
    required: false
    default: "15.5.1"

outputs:
  preview-url:
    description: "URL of the deployed preview"
    value: "${{ steps.deploy.outputs.url }}"

runs:
  using: "composite"
  steps:
    - name: Clean build directory
      run: |
        if [ -d "dist" ]; then
          echo "Removing existing dist/ directory"
          rm -rf dist
        fi
        echo "✅ Build directory is clean"
      shell: bash

    - name: Build application
      id: build
      run: |
        echo "::group::Building with: ${{ inputs.build-command }}"
        ${{ inputs.build-command }}
        echo "::endgroup::"
        echo "✅ Build command completed"
      shell: bash

    - name: Verify build output
      run: |
        if [ ! -d "dist" ]; then
          echo "❌ Build completed but dist/ directory was not created"
          exit 1
        fi

        if [ ! "$(ls -A dist)" ]; then
          echo "❌ dist/ directory exists but is empty"
          exit 1
        fi

        echo "✅ dist/ directory exists and contains files"
      shell: bash

    - name: Deploy to Firebase Preview Channel
      id: deploy
      run: |
        set +e
        echo "Deploying to preview channel: ${{ inputs.channel-id }}"

        # Capture stdout ONLY. stderr must not be folded in here: npm logs to
        # stderr, so on a runner with a cold npx cache the payload gained a
        #   npm warn exec The following package was not found and will be installed: firebase-tools@<version>
        # line, and the JSON.parse below died on it with "Unexpected token 'p'".
        # stderr is still surfaced in the log immediately after, for debugging.
        STDERR_LOG="$(mktemp)"
        RESULT=$(npx firebase-tools@${{ inputs.firebase-tools-version }} hosting:channel:deploy "${{ inputs.channel-id }}" \
          --only ${{ inputs.firebase-target }} \
          --project ${{ inputs.firebase-project }} \
          --json 2>"$STDERR_LOG")
        EXIT_CODE=$?

        echo "Firebase output:"
        echo "$RESULT"

        if [ -s "$STDERR_LOG" ]; then
          echo "Firebase stderr:"
          cat "$STDERR_LOG"
        fi
        rm -f "$STDERR_LOG"

        if [ $EXIT_CODE -ne 0 ]; then
          echo "❌ Firebase deploy failed with exit code $EXIT_CODE"
          exit $EXIT_CODE
        fi

        URL=$(echo "$RESULT" | node -e "
          const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
          console.log(data.result?.['${{ inputs.firebase-target }}']?.url || '');
        ")

        # Fail loudly instead of emitting an empty output. `set +e` at the top of
        # this step means a parse failure is otherwise silent: the step reports
        # success, and consumers only discover the missing URL much later —
        # csp-check runs as `check-csp.ts "" ""` and exits 2 with a usage error
        # that reads like a CSP violation, and comment-preview-urls renders
        # "⏳ Pending..." for a channel that is actually live.
        if [ -z "$URL" ]; then
          echo "❌ Deploy succeeded but no preview URL could be parsed from the output above."
          echo "   Downstream jobs depend on this value, so failing here instead."
          exit 1
        fi

        echo "url=$URL" >> $GITHUB_OUTPUT
        echo "✅ Preview deployed: $URL"
      shell: bash
