name: "Setup Node.js with Yarn"
description: "Sets up Node.js, enables Corepack, and installs Yarn dependencies"
author: "Chris Brewer"

inputs:
  node-version:
    description: |
      Node.js version to use. Resolution order:
        1. This input if explicitly set (e.g. `with: node-version: '24.22.1'`)
        2. The NODE_VERSION env var if set by the caller workflow
        3. Built-in default (currently 24.22.1, the Oct 2026 security release).
           24.16.0+ ships libuv 1.52.1, which hung `playwright install` extraction
           on linuxkit/some Ubuntu kernels; .github/workflows/node-canary.yml
           re-checks that on every change to this action.
    required: false
    default: ""   # Empty sentinel: "no explicit override, fall through to env/default"

runs:
  using: "composite"
  steps:
    - name: Resolve Node version
      id: resolve
      shell: bash
      run: |
        VERSION="${{ inputs.node-version }}"
        if [ -z "$VERSION" ]; then
          VERSION="${NODE_VERSION:-24.22.1}"
        fi
        VERSION="${VERSION//$'\r'/}"
        VERSION="${VERSION//$'\n'/}"
        VERSION="${VERSION#"${VERSION%%[![:space:]]*}"}"
        VERSION="${VERSION%"${VERSION##*[![:space:]]}"}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Using Node $VERSION"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.resolve.outputs.version }}

    # Corepack (bundled with Node 16+) manages Yarn; enable it to use Yarn 4.x from packageManager in package.json
    - name: Enable Corepack
      run: corepack enable
      shell: bash
