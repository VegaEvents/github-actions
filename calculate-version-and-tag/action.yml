name: 'Calculate Version and Create Tag'
description: 'Calculates next semantic version from conventional commits and (unless dry-run) creates a git tag'
author: 'Chris Brewer'

inputs:
  merge-commit-sha:
    description: 'The merge commit SHA to tag (for PR merges)'
    required: false
    default: ''
  ref:
    description: 'The git ref to use if merge-commit-sha is not provided'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for pushing tags'
    required: true
  dry-run:
    description: 'When true, calculate and output the version but do NOT create or push a git tag. Lets a caller compute the version early (e.g. to bake into a build) and create the tag in a later step.'
    required: false
    default: 'false'

outputs:
  version:
    description: 'The calculated semantic version (without v prefix)'
    value: ${{ steps.calculate.outputs.version }}
  tag_name:
    description: 'The git tag name (with v prefix)'
    value: ${{ steps.calculate.outputs.tag_name }}

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.merge-commit-sha || inputs.ref }}
        fetch-depth: 0
        persist-credentials: true
        token: ${{ inputs.github-token }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Calculate version and create tag
      id: calculate
      shell: bash
      run: |
        # Source the version calculation script
        source "${{ github.action_path }}/calculate-version.sh"

        # Configure git
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Fetch all tags
        echo "Fetching all tags..."
        git fetch --tags

        # Select the vX.Y.Z baseline explicitly instead of `git describe --tags`,
        # which is name-blind and once picked up calendar-v0.1.0 (a package
        # release), fed it to `npx semver`, and wedged every deploy. Baseline
        # selection ignores foreign tags (resolve_baseline_or_die enforces
        # that); the warning below is the observable alarm. Our repos use
        # strictly semver release tags, so ANY other tag — calendar-v*,
        # prereleases, whatever — is pollution, and we deliberately warn on
        # EVERY run until it is removed.
        NON_RELEASE_TAGS=$(git tag -l | grep -vE '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
        LATEST_TAG=$(resolve_baseline_or_die) || exit 1
        if [ -n "$NON_RELEASE_TAGS" ]; then
          echo "::warning title=Non-release tag present::Found tag(s) that are not vX.Y.Z app releases: $(echo "$NON_RELEASE_TAGS" | tr '\n' ' '). Using '$LATEST_TAG' as the version baseline. This repo should only contain semver release tags — a foreign tag is polluting it; investigate and remove it."
        fi
        NEXT_VERSION=$(calculate_version "$LATEST_TAG")
        TAG_NAME="v$NEXT_VERSION"

        echo "Calculated next version: $NEXT_VERSION"
        echo "Tag name: $TAG_NAME"

        # Dry run: output the computed version but do not create/push any tag.
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          echo ""
          echo "=== Dry run: skipping tag creation ==="
          echo "Version: $NEXT_VERSION"
          echo "Tag: $TAG_NAME"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo ""
        echo "=== Checking if tag creation is needed ==="

        # Short-circuit: no new commits / tag already exists and points to HEAD
        SHORT_CIRCUIT=false

        # Case 1: TAG_NAME equals LATEST_TAG (calculate_version returned no bump)
        if [ "$TAG_NAME" = "$LATEST_TAG" ]; then
          echo "No version bump - TAG_NAME ($TAG_NAME) equals LATEST_TAG ($LATEST_TAG)"
          SHORT_CIRCUIT=true
        fi

        # Case 2: Tag exists remotely and points to same commit as HEAD
        if [ "$SHORT_CIRCUIT" = false ]; then
          echo "Checking if tag already exists remotely..."
          
          # Disable exit-on-error for git ls-remote commands
          set +e
          
          # Prefer ^{} to get commit hash for annotated tags; fallback for lightweight tags
          REMOTE_TAG_HASH=$(git ls-remote --tags origin "refs/tags/${TAG_NAME}^{}" 2>&1 | awk '{print $1}')
          LS_REMOTE_EXIT=$?
          
          if [ $LS_REMOTE_EXIT -ne 0 ]; then
            echo "⚠️ First git ls-remote failed with exit code $LS_REMOTE_EXIT"
            echo "Output: $REMOTE_TAG_HASH"
          fi
          
          if [ -z "$REMOTE_TAG_HASH" ]; then
            REMOTE_TAG_HASH=$(git ls-remote --tags origin 2>&1 | grep "refs/tags/$TAG_NAME$" | head -1 | awk '{print $1}')
            LS_REMOTE_EXIT2=$?
            if [ $LS_REMOTE_EXIT2 -ne 0 ]; then
              echo "⚠️ Second git ls-remote failed with exit code $LS_REMOTE_EXIT2"
              echo "Output: $REMOTE_TAG_HASH"
            fi
          fi
          
          HEAD_HASH=$(git rev-parse HEAD 2>&1)
          REV_PARSE_EXIT=$?
          
          # Re-enable exit-on-error
          set -e
          
          if [ $REV_PARSE_EXIT -ne 0 ]; then
            echo "❌ git rev-parse HEAD failed with exit code $REV_PARSE_EXIT"
            echo "Output: $HEAD_HASH"
            exit 1
          fi
          
          echo "Remote tag hash: ${REMOTE_TAG_HASH:-<not found>}"
          echo "HEAD hash: $HEAD_HASH"
          
          if [ -n "$REMOTE_TAG_HASH" ] && [ "$REMOTE_TAG_HASH" = "$HEAD_HASH" ]; then
            echo "Tag $TAG_NAME already exists remotely and points to HEAD ($HEAD_HASH)"
            SHORT_CIRCUIT=true
          fi
        fi

        if [ "$SHORT_CIRCUIT" = true ]; then
          TAG_CREATED=true
          echo ""
          echo "=== Final Version (no new tag needed) ==="
          echo "Version: $NEXT_VERSION"
          echo "Tag: $TAG_NAME"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          exit 0
        else
          echo "Tag creation is needed - proceeding to retry loop"
          # Retry loop for tag creation with conflict detection
          MAX_RETRIES=3
          RETRY=0
          TAG_CREATED=false

          while [ $RETRY -lt $MAX_RETRIES ]; do
            echo ""
            echo "=== Attempt $((RETRY + 1)) of $MAX_RETRIES ==="
            
            # Re-fetch tags to detect any new tags created by concurrent jobs
            echo "Re-fetching tags to detect conflicts..."
            git fetch --tags --force

            # Check if our calculated tag already exists remotely
            if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME$"; then
              echo "❌ Tag $TAG_NAME already exists remotely (created by another job)"
              echo "Recalculating version..."
              
              # Recalculate with the new latest tag
              LATEST_TAG=$(resolve_baseline_or_die) || exit 1
              NEXT_VERSION=$(calculate_version "$LATEST_TAG")
              TAG_NAME="v$NEXT_VERSION"

              # The concurrent job may have tagged a commit that already
              # contains HEAD; then the recalc yields no bump and retrying
              # would fail 3 times trying to re-create an existing tag.
              if [ "$TAG_NAME" = "$LATEST_TAG" ]; then
                echo "No version bump after recalculation - $TAG_NAME already covers HEAD"
                echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
                echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              echo "New calculated version: $NEXT_VERSION"
              echo "New tag name: $TAG_NAME"

              RETRY=$((RETRY + 1))
              sleep 2  # Brief delay before retry
              continue
            fi

            # Re-fetch and recalculate immediately before tag creation to minimize race window
            echo "Re-fetching tags immediately before tag creation..."
            git fetch --tags --force
            LATEST_TAG=$(resolve_baseline_or_die) || exit 1
            NEXT_VERSION=$(calculate_version "$LATEST_TAG")
            TAG_NAME="v$NEXT_VERSION"
            echo "Pre-create version: $NEXT_VERSION, tag: $TAG_NAME"

            # Same no-bump guard as above: a tag fetched just now may already
            # cover HEAD, in which case there is nothing to create.
            if [ "$TAG_NAME" = "$LATEST_TAG" ]; then
              echo "No version bump after pre-create recalculation - $TAG_NAME already covers HEAD"
              echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
              echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Re-check if tag now exists (created by another job in the meantime)
            if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME$"; then
              echo "❌ Tag $TAG_NAME now exists remotely after re-fetch, retrying..."
              RETRY=$((RETRY + 1))
              sleep 2
              continue
            fi

            # Tag doesn't exist, try to create it
            echo "Creating tag $TAG_NAME at $(git rev-parse HEAD)..."
            
            # Create local tag (disable exit-on-error for explicit checking)
            set +e
            TAG_OUTPUT=$(git tag "$TAG_NAME" 2>&1)
            TAG_EXIT=$?
            set -e
            
            if [ $TAG_EXIT -eq 0 ]; then
              echo "Local tag created successfully"
              
              # Try to push tag atomically
              echo "Pushing tag to remote..."
              set +e
              PUSH_OUTPUT=$(git push origin "$TAG_NAME" 2>&1)
              PUSH_EXIT=$?
              set -e
              
              if [ $PUSH_EXIT -eq 0 ]; then
                echo "✅ Successfully created and pushed tag $TAG_NAME"
                TAG_CREATED=true
                break
              else
                # Push failed, likely due to race condition
                echo "⚠️ Tag push failed with exit code $PUSH_EXIT"
                echo "Push output: $PUSH_OUTPUT"
                git tag -d "$TAG_NAME" 2>/dev/null || true
                
                RETRY=$((RETRY + 1))
                sleep 2
                continue
              fi
            else
              echo "⚠️ Local tag creation failed with exit code $TAG_EXIT"
              echo "Tag output: $TAG_OUTPUT"
              RETRY=$((RETRY + 1))
              sleep 2
              continue
            fi
          done

          if [ "$TAG_CREATED" = false ]; then
            echo ""
            echo "❌ Failed to create unique tag after $MAX_RETRIES attempts"
            echo "This likely means multiple deployments are racing."
            echo "The concurrency lock should prevent this - please check workflow configuration."
            exit 1
          fi

          echo ""
          echo "=== Final Version ==="
          echo "Version: $NEXT_VERSION"
          echo "Tag: $TAG_NAME"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
        fi
